<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>איזה מצביע אתה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="card" id="quizCard">
      <div class="eyebrow">מבדק לא מדעי בכלל</div>
      <div class="progressWrap">
        <div class="progressMeta">
          <span id="progressLabel">שאלה 1 מתוך 7</span>
          <span id="progressPercent">14%</span>
        </div>
        <div class="progressBar"><div id="progressFill"></div></div>
      </div>
      <h1>מי אתה בקלפי בעצם?</h1>
      <p class="subtitle">שאלה אחת בכל פעם. בלי לחץ, רק שיפוט פוליטי חמור.</p>

      <div id="quiz"></div>

      <div class="actions">
        <button id="backBtn" class="secondary hidden">שאלה קודמת</button>
        <button id="nextBtn" class="primary">יאללה הבא</button>
      </div>
    </section>

    <section class="card result hidden" id="resultCard">
      <div class="eyebrow">פסק הדין</div>
      <h2 id="resultTitle"></h2>
      <div class="partyBadge" id="partyBadge">
        <img id="resultImage" alt="תמונת תוצאה" />
      </div>
      <p id="resultText" class="resultText"></p>
      <div class="shareRow">
        <button id="restartBtn" class="secondary">לעשות מחדש</button>
        <button id="shareBtn" class="primary">לשתף תוצאה</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
